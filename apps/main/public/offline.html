<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNest</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #FDFBF7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container { text-align: center; padding: 24px; max-width: 400px; }
    h1 { font-size: 24px; color: #1A2A3A; margin-bottom: 8px; }
    p { color: #4A5568; margin-bottom: 20px; line-height: 1.5; font-size: 15px; }
    .spinner {
      width: 40px; height: 40px; margin: 0 auto 16px;
      border: 4px solid #E8E2D9; border-top-color: #B85C38;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Opening BookNest…</h1>
    <p id="status">Checking your offline session</p>
  </div>
  <script>
    (function () {
      var status = document.getElementById('status');
      var CLOCK_SKEW_MS = 5 * 60 * 1000;

      function isStandalonePwa() {
        var mq = window.matchMedia('(display-mode: standalone)').matches;
        var ios = typeof navigator.standalone === 'boolean' && navigator.standalone === true;
        return mq || ios;
      }

      function openAuthDb() {
        return new Promise(function (resolve, reject) {
          var req = indexedDB.open('BookNestAuth', 1);
          req.onerror = function () { reject(req.error); };
          req.onsuccess = function () { resolve(req.result); };
        });
      }

      function getCachedSession() {
        return openAuthDb().then(function (db) {
          return new Promise(function (resolve) {
            try {
              var tx = db.transaction('sessions', 'readonly');
              var store = tx.objectStore('sessions');
              var req = store.get('current');
              req.onsuccess = function () { resolve(req.result || null); };
              req.onerror = function () { resolve(null); };
            } catch (e) {
              resolve(null);
            }
          });
        }).catch(function () { return null; });
      }

      function sessionIsValid(session) {
        if (!session || !session.expiresAt) return false;
        return Date.now() < new Date(session.expiresAt).getTime() + CLOCK_SKEW_MS;
      }

      const OFFLINE_READING_GRACE_MS = 30 * 24 * 60 * 60 * 1000;
      function sessionIsValidForOfflineReading(session) {
        if (sessionIsValid(session)) return true;
        if (!session?.user || !session.rememberMe || !session.issuedAt) return false;
        return Date.now() < new Date(session.issuedAt).getTime() + OFFLINE_READING_GRACE_MS;
      }

      function canUseOfflineSession() {
        if (isStandalonePwa()) return true;
        if (!('serviceWorker' in navigator)) return false;
        return Boolean(navigator.serviceWorker.controller);
      }

      function tryCachedRoutes() {
        if (!('caches' in window)) {
          status.textContent = 'You are offline. Open BookNest once while online, then try again.';
          return;
        }
        var routes = ['/library', '/community', '/login', '/'];
        Promise.all([
          caches.open('booknest-core-routes').catch(function () { return null; }),
          caches.open('booknest-pages').catch(function () { return null; })
        ]).then(function (cachesList) {
          var i = 0;
          function tryNext() {
            if (i >= routes.length) {
              status.textContent = 'You are offline. Visit BookNest online first to cache the app.';
              return;
            }
            var route = routes[i++];
            var idx = 0;
            function tryCache() {
              if (idx >= cachesList.length) return tryNext();
              var cache = cachesList[idx++];
              if (!cache) return tryCache();
              cache.match(route, { ignoreSearch: true }).then(function (res) {
                if (res) {
                  window.location.replace(route);
                } else {
                  tryCache();
                }
              }).catch(tryCache);
            }
            tryCache();
          }
          tryNext();
        }).catch(function () {
          status.textContent = 'You are offline. Connect to load BookNest for the first time.';
        });
      }

      getCachedSession().then(function (session) {
        if (sessionIsValidForOfflineReading(session) && canUseOfflineSession()) {
          window.location.replace('/library');
          return;
        }

        if (!isStandalonePwa()) {
          status.textContent = 'Offline mode works in the installed BookNest app. Install the app while online first.';
          tryCachedRoutes();
          return;
        }

        if (!navigator.onLine) {
          window.location.replace('/login?offline=1&session=expired');
          return;
        }
        tryCachedRoutes();
      });
    })();
  </script>
</body>
</html>
